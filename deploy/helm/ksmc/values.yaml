# Valeurs par défaut du chart Ksmc.

controller:
  image:
    repository: ghcr.io/reietsuu/ksmc-controller
    # Par défaut : appVersion du chart.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}
  # Niveau de log : TRACE, DEBUG, INFO, WARN, ERROR
  logLevel: INFO
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Stockage du controller : Template Store, cache des logiciels et des templates (PVC ReadWriteOnce).
storage:
  size: 10Gi
  # Vide = StorageClass par défaut du cluster
  storageClassName: ""

# Images des services Minecraft (une variante par version de Java : <tag>-java8, -java17, -java21, -java25).
runtime:
  image:
    repository: ghcr.io/reietsuu/ksmc-runtime
    # Par défaut : appVersion du chart.
    tag: ""

minecraft:
  # Acceptation de l'EULA Minecraft (https://aka.ms/MinecraftEULA) pour tous les serveurs gérés.
  # Doit être mis à true explicitement par l'opérateur : sans cela, les serveurs refusent de démarrer.
  acceptEula: false

# Définitions de logiciels installées par défaut (paper, folia, spigot, velocity, bungeecord, waterfall,
# fabric, forge, neoforge). Mettre à false pour gérer soi-même les SoftwareDefinition.
softwareDefinitions:
  install: true

service:
  type: ClusterIP
  port: 8080

imagePullSecrets: []

# Serveur NATS (messagerie, événements, KV).
nats:
  # false = utiliser un NATS existant via externalUrl
  enabled: true
  externalUrl: ""
  fullnameOverride: ksmc-nats
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 2Gi
  natsBox:
    enabled: false
