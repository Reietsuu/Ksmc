# Valeurs par défaut du chart Ksmc.

controller:
  image:
    repository: ghcr.io/reietsuu/ksmc-controller
    # Par défaut : appVersion du chart.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}
  # Niveau de log : TRACE, DEBUG, INFO, WARN, ERROR
  logLevel: INFO
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

service:
  type: ClusterIP
  port: 8080

imagePullSecrets: []

# Serveur NATS (messagerie, événements, KV).
nats:
  # false = utiliser un NATS existant via externalUrl
  enabled: true
  externalUrl: ""
  fullnameOverride: ksmc-nats
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 2Gi
  natsBox:
    enabled: false
