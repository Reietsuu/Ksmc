{{- /* Mot de passe initial du compte admin et clé de signature des sessions : générés une fois puis conservés. */}}
{{- $admin := lookup "v1" "Secret" .Release.Namespace "ksmc-admin" }}
apiVersion: v1
kind: Secret
metadata:
  name: ksmc-admin
  labels: {{- include "ksmc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ "admin" | b64enc }}
  {{- if $admin }}
  password: {{ index $admin.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
---
{{- $jwt := lookup "v1" "Secret" .Release.Namespace "ksmc-jwt" }}
apiVersion: v1
kind: Secret
metadata:
  name: ksmc-jwt
  labels: {{- include "ksmc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $jwt }}
  key: {{ index $jwt.data "key" }}
  {{- else }}
  key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
