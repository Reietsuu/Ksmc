{{- /* Mots de passe NATS : générés une fois puis conservés (lookup) pour ne pas casser les connexions existantes. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "ksmc-nats-auth" }}
apiVersion: v1
kind: Secret
metadata:
  name: ksmc-nats-auth
  labels: {{- include "ksmc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  controller-password: {{ index $existing.data "controller-password" }}
  service-password: {{ index $existing.data "service-password" }}
  {{- else }}
  controller-password: {{ randAlphaNum 32 | b64enc }}
  service-password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
