apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ksmc.fullname" . }}-controller
  labels: {{- include "ksmc.labels" . | nindent 4 }}
---
# Identité des Pods de services : authentifiée par le controller (jeton projeté, audience ksmc). Aucun droit Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ksmc-service
  labels: {{- include "ksmc.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Identité des Jobs de construction (BuildTools, installeurs Forge/NeoForge). Aucun droit Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ksmc-builder
  labels: {{- include "ksmc.labels" . | nindent 4 }}
automountServiceAccountToken: false
