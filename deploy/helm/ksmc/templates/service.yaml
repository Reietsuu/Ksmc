apiVersion: v1
kind: Service
metadata:
  name: {{ include "ksmc.fullname" . }}-controller
  labels:
    {{- include "ksmc.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ksmc.controllerSelector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
