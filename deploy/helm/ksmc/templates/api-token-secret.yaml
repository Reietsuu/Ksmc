{{- /* Jeton administrateur de l'API (provisoire, avant les comptes) : généré une fois puis conservé. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "ksmc-api-token" }}
apiVersion: v1
kind: Secret
metadata:
  name: ksmc-api-token
  labels: {{- include "ksmc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
