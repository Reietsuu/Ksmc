apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ksmc.fullname" . }}-controller
  labels:
    {{- include "ksmc.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "ksmc.controllerSelector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ksmc.controllerSelector" . | nindent 8 }}
      {{- with .Values.controller.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ksmc.fullname" . }}-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            - name: KSMC_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: KSMC_HTTP_PORT
              value: "8080"
            - name: KSMC_NATS_URL
              value: {{ include "ksmc.natsUrl" . | quote }}
            {{- if or .Values.nats.enabled .Values.nats.externalAuth.controllerUser }}
            - name: KSMC_NATS_USER
              value: {{ .Values.nats.enabled | ternary "controller" .Values.nats.externalAuth.controllerUser | quote }}
            - name: KSMC_NATS_PASSWORD
              valueFrom: {secretKeyRef: {name: ksmc-nats-auth, key: controller-password}}
            - name: KSMC_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: ksmc-admin, key: password}}
            - name: KSMC_JWT_KEY
              valueFrom: {secretKeyRef: {name: ksmc-jwt, key: key}}
            - name: KSMC_NATS_SERVICE_USER
              value: {{ .Values.nats.enabled | ternary "service" .Values.nats.externalAuth.serviceUser | quote }}
            {{- end }}
            - name: KSMC_DATA_DIR
              value: /data
            - name: KSMC_RUNTIME_IMAGE
              value: {{ .Values.runtime.image.repository | quote }}
            - name: KSMC_RUNTIME_TAG
              value: {{ .Values.runtime.image.tag | default .Chart.AppVersion | quote }}
            - name: KSMC_INTERNAL_URL
              value: "http://{{ include "ksmc.fullname" . }}-controller.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}"
            - name: KSMC_ACCEPT_EULA
              value: {{ .Values.minecraft.acceptEula | quote }}
            - name: KSMC_LOG_LEVEL
              value: {{ .Values.controller.logLevel | quote }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ksmc.fullname" . }}-data
      {{- with .Values.controller.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
