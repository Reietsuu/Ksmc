{{- if .Values.networkPolicy.enabled }}
# Seuls les proxies (et le reste du namespace pour la santé/les métriques) joignent les serveurs de jeu.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ksmc.fullname" . }}-servers
  labels: {{- include "ksmc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ksmc.io/environment: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              ksmc.io/environment: proxy
      ports:
        - {protocol: TCP, port: 25565}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 8090}
{{- end }}
