name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "25"}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build -PksmcVersion="${GITHUB_REF_NAME#v}"
      - name: Chart Helm
        run: |
          scripts/tools.sh
          export PATH="$PWD/.tools/bin:$PATH"
          V="${GITHUB_REF_NAME#v}"
          helm dependency update deploy/helm/ksmc
          helm package deploy/helm/ksmc --version "$V" --app-version "$V" -d dist/
          cp deploy/helm/ksmc/crds/*.yml dist/
      - name: Release GitHub
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
