[versions]
fabric8 = "7.9.0"
josdk = "5.6.2"
javalin = "7.2.3"
jnats = "2.26.4"
junit = "6.1.3"
assertj = "3.27.7"
logback = "1.6.5"
gson = "2.14.0"
testcontainers = "2.0.5"
picocli = "4.7.7"

[libraries]
fabric8-client = { module = "io.fabric8:kubernetes-client", version.ref = "fabric8" }
fabric8-model-annotator = { module = "io.fabric8:kubernetes-model-common", version.ref = "fabric8" }
fabric8-crd-generator = { module = "io.fabric8:crd-generator-api-v2", version.ref = "fabric8" }
fabric8-server-mock = { module = "io.fabric8:kubernetes-server-mock", version.ref = "fabric8" }
fabric8-generator-annotations = { module = "io.fabric8:generator-annotations", version.ref = "fabric8" }
josdk = { module = "io.javaoperatorsdk:operator-framework", version.ref = "josdk" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
